groups:
  - name: queue-alerts
    rules:
      - alert: HighQueueDepth
        expr: sum(queue_depth{status="waiting"}) > 100
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "High queue depth"
          description: "Queue waiting jobs > 100 for 5m"

      - alert: JobFailureRateHigh
        expr: |
          sum(increase(queue_jobs_failed_total[5m]))
            /
          (sum(increase(queue_jobs_completed_total[5m])) + sum(increase(queue_jobs_failed_total[5m])))
            > 0.2
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "High job failure rate"
          description: "Job failure rate > 20% over 10m"

      - alert: JobProcessingLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(queue_job_processing_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "High p95 job processing time"
          description: "p95 job processing time > 2s for 10m"

      - alert: DeadLetterQueueNotEmpty
        expr: sum(queue_depth{status="failed"}) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "DLQ has messages"
          description: "There are failed jobs waiting in DLQ over 30m"
