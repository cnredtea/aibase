global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerting_rules.yml

scrape_configs:
  - job_name: 'queue-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['queue-worker:9464']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
